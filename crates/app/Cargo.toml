[package]
name = "solitaire-app"
description = "Klondike solitaire for web, desktop and Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "solitaire"
path = "src/main.rs"

[dependencies]
solitaire-core.workspace = true
solitaire-web-bridge.workspace = true
macroquad.workspace = true
thiserror = "2.0.21"
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
