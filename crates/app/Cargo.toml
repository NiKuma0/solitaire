[package]
name = "solitaire-app"
description = "Klondike solitaire for web, desktop and Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "solitaire"
path = "src/main.rs"

[dependencies]
solitaire-core.workspace = true
solitaire-web-bridge.workspace = true
macroquad.workspace = true
thiserror = "2.0.21"
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
png = "0.17.16"

[lints]
workspace = true

# Android build with cargo-quad-apk (see .github/workflows/release.yml).
[package.metadata.android]
package_name = "io.github.nikuma0.solitaire"
label = "Solitaire"
# Compile against the newest platform; target 34 keeps system bars outside
# the window (35+ forces edge-to-edge drawing under them).
android_version = 36
target_sdk_version = 34
min_sdk_version = 24
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]
# Generated by `cargo run -p solitaire-app --example export_icons -- crates/app/android-res`.
res = "android-res"
icon = "@mipmap/ic_launcher"
fullscreen = false

[package.metadata.android.activity_attributes]
"android:exported" = "true"
