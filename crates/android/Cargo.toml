[package]
name = "solitaire-android"
description = "Android entry point of Solitaire, built into an APK by cargo-quad-apk."
version.workspace = true
# 2021 on purpose: see src/main.rs.
edition = "2021"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# The APK's Java side loads `lib<last part of package_name>.so` and
# cargo-quad-apk names the library after this binary, so it must be
# `solitaire`. Only built with `--features apk`, so it does not collide with
# the desktop binary of the same name in crates/app.
[[bin]]
name = "solitaire"
path = "src/main.rs"
required-features = ["apk"]

[features]
apk = []

[dependencies]
solitaire-app = { path = "../app" }
macroquad.workspace = true

# No `[lints] workspace = true`: the injected Android glue needs `unsafe`.

# Android build with cargo-quad-apk (see .github/workflows/release.yml).
[package.metadata.android]
package_name = "io.github.nikuma0.solitaire"
label = "Solitaire"
# Compile against the newest platform; target 34 keeps system bars outside
# the window (35+ forces edge-to-edge drawing under them).
android_version = 36
target_sdk_version = 34
min_sdk_version = 24
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]
# Generated by `cargo run -p solitaire-app --example export_icons -- android crates/android/android-res`.
res = "android-res"
icon = "@mipmap/ic_launcher"
fullscreen = false

[package.metadata.android.activity_attributes]
"android:exported" = "true"
